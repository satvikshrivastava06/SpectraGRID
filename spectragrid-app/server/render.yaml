services:
  - type: web
    name: spectragrid-backend
    runtime: node
    rootDir: .
    buildCommand: npm install && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: ML_SERVICE_URL
        value: http://localhost:8000
      - key: CORS_ORIGIN
        value: https://your-frontend.vercel.app
