services:
  - type: web
    name: spectragrid-backend
    runtime: node
    rootDir: .
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: ML_SERVICE_URL
        fromService:
          name: spectragrid-ml
          type: web
          property: host
      - key: CORS_ORIGIN
        value: https://your-frontend.netlify.app

  - type: web
    name: spectragrid-ml
    runtime: docker
    rootDir: ./ml-service
    dockerfilePath: ./Dockerfile
    envVars:
      - key: ENV
        value: production
      - key: NODE_SERVICE_ORIGIN
        fromService:
          name: spectragrid-backend
          type: web
          property: host
